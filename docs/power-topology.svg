<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" role="img" aria-label="Power topology: USB feeds the ESP32, a separate pack feeds VM on both drivers, the ESP32 3.3V pin feeds VCC, and every ground returns to one common bus.">
<style>
 .b{fill:#f6f8fa;stroke:#6e7781;stroke-width:1.5}
 .l{font:700 14px sans-serif;fill:#1f2328}
 .n{font:11.5px sans-serif;fill:#57606a}
 .t{font:500 10.5px monospace;fill:#57606a}
 .w{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style>
<rect x="0" y="0" width="840" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="context-stroke"/></marker></defs>
<rect class="b" x="20" y="40" width="112" height="46" rx="5"/>
<text class="l" x="76" y="61" text-anchor="middle">USB</text>
<text class="n" x="76" y="77" text-anchor="middle">5V from laptop</text>
<rect class="b" x="176" y="24" width="152" height="122" rx="6"/>
<text class="l" x="252" y="62" text-anchor="middle">ESP32</text>
<text class="n" x="252" y="79" text-anchor="middle">WROOM-32</text>
<text class="t" x="252" y="104" text-anchor="middle">3V3 OUT</text>
<rect class="b" x="440" y="20" width="168" height="72" rx="5"/>
<text class="l" x="524" y="46" text-anchor="middle">TB6612 #1</text>
<text class="n" x="524" y="65" text-anchor="middle">upper + lower mouth</text>
<rect class="b" x="440" y="112" width="168" height="72" rx="5"/>
<text class="l" x="524" y="138" text-anchor="middle">TB6612 #2</text>
<text class="n" x="524" y="157" text-anchor="middle">eyes</text>
<rect class="b" x="20" y="206" width="112" height="52" rx="5"/>
<text class="l" x="76" y="228" text-anchor="middle">3.7-4.5V</text>
<text class="n" x="76" y="245" text-anchor="middle">1S LiPo / 3xAA</text>
<path class="w" stroke="#d1242f" d="M132,63 H176" marker-end="url(#ah)"/>
<path class="w" stroke="#d1242f" d="M328,100 H372 V44 H440" marker-end="url(#ah)"/>
<path class="w" stroke="#d1242f" d="M372,100 V136 H440" marker-end="url(#ah)"/>
<circle cx="372" cy="100" r="4" fill="#d1242f"/>
<text class="t" x="384" y="92">3V3 to VCC</text>
<path class="w" stroke="#bc4c00" d="M132,232 H404 V68 H440" marker-end="url(#ah)"/>
<path class="w" stroke="#bc4c00" d="M404,232 V160 H440" marker-end="url(#ah)"/>
<circle cx="404" cy="232" r="4" fill="#bc4c00"/>
<text class="t" x="196" y="224">pack to VM</text>
<path class="w" stroke="#bc4c00" d="M300,232 V286"/>
<line class="w" stroke="#bc4c00" x1="286" y1="288" x2="314" y2="288"/>
<line class="w" stroke="#bc4c00" x1="286" y1="298" x2="314" y2="298"/>
<path class="w" stroke="#384250" d="M300,300 V336"/>
<circle cx="300" cy="232" r="4" fill="#bc4c00"/>
<text class="n" x="322" y="288">470-1000 uF</text>
<text class="n" x="322" y="303">bulk, at the drivers</text>
<path d="M64,336 H620" fill="none" stroke="#384250" stroke-width="5" stroke-linecap="round"/>
<path class="w" stroke="#384250" d="M76,258 V336"/>
<path class="w" stroke="#384250" d="M252,146 V336"/>
<path class="w" stroke="#384250" d="M470,92 V336"/>
<path class="w" stroke="#384250" d="M560,184 V336"/>
<circle cx="76" cy="336" r="4" fill="#384250"/><circle cx="252" cy="336" r="4" fill="#384250"/>
<circle cx="300" cy="336" r="4" fill="#384250"/><circle cx="470" cy="336" r="4" fill="#384250"/>
<circle cx="560" cy="336" r="4" fill="#384250"/>
<text class="l" x="640" y="341">COMMON GROUND</text>
<text class="n" x="640" y="358">every ground ties here</text>
</svg>
